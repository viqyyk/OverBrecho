<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Over Brechó</title>
<style>
  :root{
    --bg:#0d0d0d; --panel:#171717; --panel2:#202020; --text:#f5f5f5;
    --muted:#aaa; --line:#303030; --accent:#fff; --danger:#d96b6b;
    --success:#9bd18b; --shadow:0 16px 50px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at top,#202020 0,#0d0d0d 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button,input{font:inherit}
  .wrap{max-width:1250px;margin:auto;padding:28px 20px 50px}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:115px;height:82px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
  .brand h1{font-size:25px;margin:0}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .btn{border:1px solid var(--line);background:#fff;color:#111;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
  .btn.secondary{background:var(--panel);color:#fff}
  .btn.danger{background:transparent;color:#ff9b9b}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .card{background:linear-gradient(145deg,#1b1b1b,#131313);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
  .stat-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .stat-value{font-size:25px;font-weight:800;margin-top:7px}
  .toolbar{display:flex;gap:10px;align-items:center;margin:15px 0;flex-wrap:wrap}
  .search{flex:1;min-width:220px;background:#141414;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px 14px;outline:none}
  select{background:#141414;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
  .piece{overflow:hidden;padding:0;position:relative}
  .piece.sold{opacity:.58;filter:grayscale(1)}
  .photo{height:255px;background:#292929;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover}
  .placeholder{color:#777;font-size:48px}
  .piece-body{padding:15px}
  .piece-title{font-weight:800;font-size:17px;margin-bottom:8px}
  .price{font-size:18px;font-weight:800}
  .meta{color:var(--muted);font-size:12px;margin-top:5px}
  .badge{position:absolute;top:10px;left:10px;padding:6px 9px;border-radius:999px;background:#fff;color:#111;font-size:11px;font-weight:800}
  .sold .badge{background:#555;color:#fff}
  .actions{display:flex;gap:7px;margin-top:14px}
  .actions button{flex:1;padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:#222;color:#fff;cursor:pointer;font-size:12px}
  .actions button.primary{background:#fff;color:#111}
  dialog{border:1px solid #3a3a3a;border-radius:20px;background:#151515;color:#fff;width:min(560px,calc(100% - 28px));padding:0;box-shadow:0 30px 90px #000}
  dialog::backdrop{background:rgba(0,0,0,.72)}
  .modal{padding:22px}
  .modal h2{margin:0 0 18px}
  .form{display:grid;gap:13px}
  label{font-size:12px;color:#bbb}
  input[type=text],input[type=number],input[type=file]{width:100%;margin-top:6px;background:#0e0e0e;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}
  .preview{height:180px;border:1px dashed #444;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#101010;color:#666}
  .preview img{width:100%;height:100%;object-fit:contain}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
  .empty{text-align:center;color:#888;padding:55px 10px;border:1px dashed #333;border-radius:18px;grid-column:1/-1}
  @media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.brand img{width:90px}}
  @media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{height:190px}.piece-body{padding:11px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="logos.png" alt="Over Brechó">
      <div><h1>OVER BRECHÓ</h1><p>Controladoria</p></div>
    </div>
    <button class="btn" onclick="openModal()">+ Nova peça</button>
  </header>

  <section class="stats">
    <div class="card"><div class="stat-label">Peças cadastradas</div><div class="stat-value" id="total">0</div></div>
    <div class="card"><div class="stat-label">Disponíveis</div><div class="stat-value" id="available">0</div></div>
    <div class="card"><div class="stat-label">Faturamento</div><div class="stat-value" id="revenue">R$ 0,00</div></div>
    <div class="card"><div class="stat-label">Lucro</div><div class="stat-value" id="profit">R$ 0,00</div></div>
  </section>

  <div class="toolbar">
    <input class="search" id="search" placeholder="Buscar peça..." oninput="render()">
    <select id="filter" onchange="render()">
      <option value="all">Todas</option>
      <option value="available">Disponíveis</option>
      <option value="sold">Vendidas</option>
    </select>
  </div>

  <main id="grid" class="grid"></main>
</div>

<dialog id="dialog">
  <div class="modal">
    <h2 id="modalTitle">Nova peça</h2>
    <form class="form" id="form">
      <input type="hidden" id="editId">
      <label>Nome / identificação
        <input id="name" type="text" placeholder="Ex.: Jaqueta jeans vintage" required>
      </label>
      <div class="row">
        <label>Valor de venda (R$)
          <input id="salePrice" type="number" min="0" step="0.01" placeholder="0,00" required>
        </label>
        <label>Custo da peça (R$)
          <input id="cost" type="number" min="0" step="0.01" placeholder="0,00">
        </label>
      </div>
      <label>Imagem da peça
        <input id="image" type="file" accept="image/*">
      </label>
      <div class="preview" id="preview">Prévia da imagem</div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="dialog.close()">Cancelar</button>
        <button class="btn" type="submit">Salvar peça</button>
      </div>
    </form>
  </div>
</dialog>

<script>
const KEY='over_brecho_v1';
let pieces=JSON.parse(localStorage.getItem(KEY)||'[]');
let currentImage='';

const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
const save=()=>localStorage.setItem(KEY,JSON.stringify(pieces));

function openModal(id=null){
  document.getElementById('form').reset();
  document.getElementById('editId').value='';
  currentImage='';
  document.getElementById('preview').innerHTML='Prévia da imagem';
  document.getElementById('modalTitle').textContent=id?'Editar peça':'Nova peça';
  if(id){
    const p=pieces.find(x=>x.id===id);
    if(!p)return;
    editId.value=p.id; name.value=p.name; salePrice.value=p.salePrice; cost.value=p.cost||'';
    currentImage=p.image||'';
    preview.innerHTML=currentImage?`<img src="${currentImage}" alt="">`:'Prévia da imagem';
  }
  dialog.showModal();
}
image.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{currentImage=r.result;preview.innerHTML=`<img src="${currentImage}" alt="">`};
  r.readAsDataURL(file);
});

form.addEventListener('submit',e=>{
  e.preventDefault();
  const id=editId.value||crypto.randomUUID();
  const old=pieces.find(x=>x.id===id);
  const item={
    id,name:name.value.trim(),salePrice:Number(salePrice.value||0),
    cost:Number(cost.value||0),image:currentImage||old?.image||'',
    sold:old?.sold||false, soldAt:old?.soldAt||null
  };
  if(old) Object.assign(old,item); else pieces.unshift(item);
  save(); dialog.close(); render();
});

function toggleSold(id){
  const p=pieces.find(x=>x.id===id); if(!p)return;
  p.sold=!p.sold; p.soldAt=p.sold?new Date().toISOString():null;
  save();render();
}
function removePiece(id){
  if(!confirm('Excluir esta peça? Ela será removida do controle.'))return;
  pieces=pieces.filter(x=>x.id!==id);save();render();
}
function render(){
  const q=search.value.toLowerCase().trim(), f=filter.value;
  const list=pieces.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(f==='all'||(f==='sold'&&p.sold)||(f==='available'&&!p.sold)));
  grid.innerHTML=list.length?list.map(p=>`
    <article class="card piece ${p.sold?'sold':''}">
      <span class="badge">${p.sold?'VENDIDA':'DISPONÍVEL'}</span>
      <div class="photo">${p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:'<div class="placeholder">♡</div>'}</div>
      <div class="piece-body">
        <div class="piece-title">${esc(p.name)}</div>
        <div class="price">${money(p.salePrice)}</div>
        <div class="meta">Custo: ${money(p.cost)} · ${p.sold&&p.soldAt?'Vendida em '+new Date(p.soldAt).toLocaleDateString('pt-BR'): 'Em estoque'}</div>
        <div class="actions">
          <button class="primary" onclick="toggleSold('${p.id}')">${p.sold?'Marcar disponível':'Marcar vendida'}</button>
          <button onclick="openModal('${p.id}')">Editar</button>
          <button class="danger" onclick="removePiece('${p.id}')">Excluir</button>
        </div>
      </div>
    </article>`).join(''):'<div class="empty">Nenhuma peça encontrada.<br>Cadastre sua primeira peça em “+ Nova peça”.</div>';

  total.textContent=pieces.length;
  available.textContent=pieces.filter(p=>!p.sold).length;
  revenue.textContent=money(pieces.filter(p=>p.sold).reduce((s,p)=>s+p.salePrice,0));
  profit.textContent=money(pieces.filter(p=>p.sold).reduce((s,p)=>s+(p.salePrice-p.cost),0));
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
render();
</script>
</body>
</html>
